name: build
on: { push: { branches: [main], tags: ['v*'] }, pull_request: {} }
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: '25.0.5.1+2' }
      - run: tools/fetch-libs.sh && ./build.sh test
      - run: cd build && sha256sum Masthead-*.jar > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: masthead, path: "build/Masthead-*.jar\nbuild/SHA256SUMS" }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with: { name: masthead }
      # a tag with a "-" in it (v1.0.0-rc.1) is a pre-release; v1.0.0 is not
      - run: gh release create "$GITHUB_REF_NAME" Masthead-*.jar SHA256SUMS $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac) --generate-notes --verify-tag -R "$GITHUB_REPOSITORY"
        env: { GH_TOKEN: "${{ github.token }}" }
